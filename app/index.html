<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice Cover Studio</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="panel" aria-label="Cover controls">
    <h1>Neon Vice Cover Studio</h1>
    <p class="tagline">Turn a photo and a caption into GTA-poster-style cover art. Everything runs on your machine — no uploads, no network.</p>

    <fieldset>
      <legend>Photo</legend>
      <label class="file">Choose a photo <input id="photo" type="file" accept="image/*"></label>
      <label class="check"><input id="samePhoto" type="checkbox" checked> Same photo in every panel</label>
      <button id="samples" type="button">Load the sample photos</button>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="row" id="layouts"></div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="row" id="grades"></div>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Title <input id="title" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="Neon nights · Ocean Drive"></label>
      <label>Title size <input id="titleSize" type="range" min="0.7" max="1.4" step="0.05" value="1"> <span id="titleSizeVal">100%</span></label>
    </fieldset>

    <fieldset>
      <legend id="panelName">Panel 1 of 3</legend>
      <div class="row" id="panels"></div>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"> <span id="zoomVal">100%</span></label>
      <label>Pan left–right <input id="panx" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <label>Pan up–down <input id="pany" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <button id="resetCrop" type="button">Reset this panel</button>
    </fieldset>

    <fieldset>
      <legend>Export size</legend>
      <div class="row" id="sizes"></div>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
    <p class="hint">Click a panel in the preview to select it, then drag its photo to pan.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
